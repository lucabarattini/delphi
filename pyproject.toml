[project]
name = "delphi"
version = "0.1.0"
description = "Deep research on tonight's NBA games: a Planner sends one Game Analyst per game, and a Verdict Writer sets the Kalshi crowd's pick next to what past prices say about it after fees"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai-agents[litellm]>=0.22",
    "google-cloud-aiplatform>=1.40.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]
